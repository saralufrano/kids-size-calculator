<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Size Will They Be?</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,sans-serif; background:#f6fcff; color:#5b5a57; }
    main { width:min(680px,100%); background:#f4f8f6; border:1px solid #dcdFA3; border-radius:24px; padding:40px; box-shadow:0 14px 40px rgba(91,90,87,.10); }
    h1 { margin:0 0 10px; font-size:clamp(2rem,6vw,3.5rem); line-height:1; color:#373733; }
    .intro { margin:0 0 14px; font-size:1.1rem; color:#5f5d5b; }
    .tabs { display:flex; gap:8px; margin-bottom:18px; }
    .tab { width:auto; min-height:38px; margin:0; padding:0 26px; border:1px solid #abb7d8; background:white; color:#373733; }
    .tab.active { background:#afdc99; border-color:#8ebc7b; }
    .unit-row { display:flex; align-items:center; gap:10px; margin:0 0 22px; }
    .unit-label { font-size:.85rem; font-weight:700; color:#5f5d5b; }
    .unit-toggle { display:flex; gap:6px; padding:4px; border:1px solid #d7ddd9; border-radius:12px; background:#fff; }
    .unit-btn,.task-btn { width:auto; min-height:34px; margin:0; padding:0 14px; border:0; border-radius:9px; background:transparent; color:#5f5d5b; font-size:.9rem; }
    .unit-btn.active,.task-btn.active { background:#afdc99; color:#373733; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .fields.one { grid-template-columns:1fr; }
    .fields > div { min-width:0; }
    label { display:block; margin-bottom:8px; font-weight:700; }
    select,input,button { width:100%; min-width:0; min-height:52px; border-radius:12px; font:inherit; }
    select,input { border:1px solid #abb7d8; padding:0 14px; background:#fff; color:#373733; }
    button { margin-top:22px; border:0; font-weight:700; cursor:pointer; }
    #calculate { background:#afdc99; color:#373733; animation:pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.015); } }
    #result { display:none; margin-top:26px; padding:24px; border-radius:16px; background:#afdc99; text-align:center; color:#373733; }
    #result.show { display:block; }
    #sizeResult { display:block; margin:8px 0; font-size:3rem; font-weight:800; }
    #detail,.note { color:#5f5d5b; }
    #detail { line-height:1.45; }
    .note { margin:20px 0 0; font-size:.85rem; text-align:center; }
    .privacy-link { margin:10px 0 0; font-size:.78rem; text-align:center; }
    .privacy-link a { color:#5f5d5b; }
    .hidden { display:none !important; }
    #launch { position:fixed; inset:0; z-index:99; display:grid; place-items:center; padding:28px; background:#f6fcff; color:#373733; text-align:center; transition:opacity .25s ease; }
    #launch .mark { width:min(42vw,180px); aspect-ratio:1; margin:0 auto 30px; display:grid; place-items:center; border-radius:34px; background:#afdc99; font-size:clamp(1.6rem,8vw,2.6rem); font-weight:800; letter-spacing:-.06em; }
    #launch h2 { margin:0 0 18px; font-size:clamp(2.5rem,11vw,4.5rem); line-height:.95; color:#373733; }
    #launch p { margin:0; font-size:clamp(1rem,4.5vw,1.25rem); color:#5f5d5b; }
    @media (prefers-reduced-motion:reduce) { #calculate { animation:none; } #launch { transition:none; } }
    @media (max-width:560px) {
      main{padding:28px 22px}
      .fields{grid-template-columns:1fr}
      .tabs{display:grid;grid-template-columns:1fr 1fr}
      .tab{padding:0}
      .unit-row{justify-content:space-between}
    }
  </style>
</head>
<body>
  <section id="launch" aria-hidden="true">
    <div>
      <div class="mark">12M → ?</div>
      <h2>What size<br>will they be?</h2>
      <p>Stop doing baby math in public.</p>
    </div>
  </section>

  <main>
    <h1>What size will they be?</h1>
    <p class="intro" id="intro">They wear this size now. What size should you buy for later?</p>

    <div class="tabs">
      <button class="tab active" data-mode="clothes">Clothes</button>
      <button class="tab" data-mode="shoes">Shoes</button>
    </div>

    <div id="clothesTaskRow" class="unit-row">
      <span class="unit-label">What do you need?</span>
      <div class="unit-toggle" aria-label="Clothing task">
        <button class="task-btn active" data-task="future" type="button">Plan ahead</button>
        <button class="task-btn" data-task="check" type="button">Check a size</button>
      </div>
    </div>

    <div id="unitRow" class="unit-row">
      <span class="unit-label">Clothing sizes</span>
      <div class="unit-toggle" aria-label="Clothing size units">
        <button class="unit-btn active" data-unit="us" type="button">US sizes</button>
        <button class="unit-btn" data-unit="cm" type="button">CM</button>
      </div>
    </div>

    <div id="clothesFields" class="fields">
      <div>
        <label for="currentSize">They wear...</label>
        <select id="currentSize"></select>
      </div>
      <div>
        <label for="targetDate">I need it to fit in...</label>
        <input id="targetDate" type="month" />
      </div>
    </div>

    <div id="checkFields" class="fields hidden">
      <div>
        <label for="knownSize">They wear (US)...</label>
        <select id="knownSize"></select>
      </div>
      <div>
        <label for="itemCm">The item says (CM)...</label>
        <select id="itemCm"></select>
      </div>
    </div>

    <div id="shoeFields" class="fields one hidden">
      <div>
        <label for="age">They are...</label>
        <select id="age"><option value="">Choose age</option></select>
      </div>
    </div>

    <button id="calculate">Tell me what size to buy</button>

    <section id="result" aria-live="polite">
      <div id="resultLabel">Best bet:</div>
      <span id="sizeResult"></span>
      <div id="detail"></div>
    </section>

    <p class="note" id="note">Quick estimate only — kids and brands grow differently.</p>
    <p class="privacy-link"><a href="privacy.html">Privacy Policy</a></p>
  </main>

  <script>
    const launch=document.getElementById("launch");
    const isNative=!!window.Capacitor?.isNativePlatform?.();
    if(isNative){
      setTimeout(()=>{ launch.style.opacity="0"; setTimeout(()=>launch.remove(),250); },900);
    } else launch.remove();

    const sizes=[
      {m:3,us:"3M",cm:62},
      {m:6,us:"6M",cm:68},
      {m:9,us:"9M",cm:74},
      {m:12,us:"12M",cm:80},
      {m:18,us:"18M",cm:86},
      {m:24,us:"24M",cm:92},
      {m:30,us:"2T",cm:92},
      {m:36,us:"3T",cm:98},
      {m:48,us:"4T",cm:104},
      {m:60,us:"5T",cm:110}
    ];
    const cmSizes=[{m:3,cm:62},{m:6,cm:68},{m:9,cm:74},{m:12,cm:80},{m:18,cm:86},{m:27,cm:92},{m:36,cm:98},{m:48,cm:104},{m:60,cm:110}];
    const shoes=[[3,"1–2C"],[6,"2–3C"],[9,"3–4C"],[12,"4–5C"],[18,"5–6C"],[24,"6–7C"],[30,"7–8C"],[36,"8–9C"],[48,"9–10C"],[54,"10–11C"],[60,"10–12C"]];
    const now=new Date();
    const target=document.getElementById("targetDate");
    const result=document.getElementById("result");
    const ageSelect=document.getElementById("age");
    const currentSize=document.getElementById("currentSize");
    const knownSize=document.getElementById("knownSize");
    const itemCm=document.getElementById("itemCm");
    let mode="clothes";
    let clothesTask="future";
    let clothesUnit="us";

    target.min=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;

    for(let m=0;m<=60;m++){
      const y=Math.floor(m/12), r=m%12;
      const label=m===0?"Newborn":y?`${y} year${y>1?"s":""}${r?` ${r} month${r>1?"s":""}`:""}`:`${m} month${m===1?"":"s"}`;
      ageSelect.add(new Option(label,m));
    }

    function populateClothingSizes(preserveValue=""){
      const previous=preserveValue || currentSize.value;
      currentSize.innerHTML="";
      currentSize.add(new Option("Choose a size",""));

      if(clothesUnit==="us"){
        sizes.forEach(size=>currentSize.add(new Option(size.us,size.m)));
        if(previous && sizes.some(size=>String(size.m)===String(previous))){
          currentSize.value=String(previous);
        } else if(previous){
          const previousCm=cmSizes.find(size=>String(size.m)===String(previous))?.cm;
          const match=sizes.find(size=>size.cm===previousCm);
          if(match) currentSize.value=String(match.m);
        }
      } else {
        cmSizes.forEach(size=>currentSize.add(new Option(`${size.cm} cm`,size.m)));
        if(previous){
          const previousSize=sizes.find(size=>String(size.m)===String(previous));
          const previousCm=previousSize?.cm || cmSizes.find(size=>String(size.m)===String(previous))?.cm;
          const match=cmSizes.find(size=>size.cm===previousCm);
          if(match) currentSize.value=String(match.m);
        }
      }
    }

    function formatSize(size,unit){
      if(unit==="cm") return `${size.cm} cm`;
      if(size.us) return size.us;
      return size.m<=27?"24M / 2T":(sizes.find(s=>s.m>=size.m)||sizes.at(-1)).us;
    }

    function populateCheckSizes(){
      knownSize.innerHTML="";
      knownSize.add(new Option("Choose their size",""));
      sizes.forEach(size=>knownSize.add(new Option(size.us,size.m)));

      itemCm.innerHTML="";
      itemCm.add(new Option("Choose the item size",""));
      cmSizes.forEach(size=>itemCm.add(new Option(`${size.cm} cm`,size.cm)));
    }

    populateClothingSizes();
    populateCheckSizes();

    document.querySelectorAll(".task-btn").forEach(btn=>btn.onclick=()=>{
      clothesTask=btn.dataset.task;
      document.querySelectorAll(".task-btn").forEach(b=>b.classList.toggle("active",b===btn));
      document.getElementById("unitRow").classList.toggle("hidden",clothesTask!=="future");
      document.getElementById("clothesFields").classList.toggle("hidden",clothesTask!=="future");
      document.getElementById("checkFields").classList.toggle("hidden",clothesTask!=="check");
      document.getElementById("intro").textContent=clothesTask==="future"
        ?"They wear this size now. What size should you buy for later?"
        :"See how a cm size compares to what they wear now.";
      document.getElementById("calculate").textContent=clothesTask==="future"?"Tell me what size to buy":"Will it fit?";
      document.getElementById("note").textContent=clothesTask==="future"
        ?"Quick estimate only — kids and brands grow differently."
        :"Approximate conversion only — fit varies by kid and brand.";
      result.classList.remove("show");
    });

    document.querySelectorAll(".unit-btn").forEach(btn=>btn.onclick=()=>{
      const previous=currentSize.value;
      clothesUnit=btn.dataset.unit;
      document.querySelectorAll(".unit-btn").forEach(b=>b.classList.toggle("active",b===btn));
      populateClothingSizes(previous);
      result.classList.remove("show");
    });

    document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
      mode=tab.dataset.mode;
      document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===tab));

      const isClothes=mode==="clothes";
      document.getElementById("clothesTaskRow").classList.toggle("hidden",!isClothes);
      document.getElementById("shoeFields").classList.toggle("hidden",isClothes);

      if(isClothes){
        document.getElementById("unitRow").classList.toggle("hidden",clothesTask!=="future");
        document.getElementById("clothesFields").classList.toggle("hidden",clothesTask!=="future");
        document.getElementById("checkFields").classList.toggle("hidden",clothesTask!=="check");
        document.getElementById("intro").textContent=clothesTask==="future"
          ?"They wear this size now. What size should you buy for later?"
          :"See how a cm size compares to what they wear now.";
        document.getElementById("calculate").textContent=clothesTask==="future"?"Tell me what size to buy":"Will it fit?";
        document.getElementById("note").textContent=clothesTask==="future"
          ?"Quick estimate only — kids and brands grow differently."
          :"Approximate conversion only — fit varies by kid and brand.";
      } else {
        document.getElementById("unitRow").classList.add("hidden");
        document.getElementById("clothesFields").classList.add("hidden");
        document.getElementById("checkFields").classList.add("hidden");
        document.getElementById("intro").textContent="How old are they? Get a starting shoe size.";
        document.getElementById("calculate").textContent="Tell me what size to try";
        document.getElementById("note").textContent="Starting point only — shoe fit varies a lot by kid and brand.";
      }

      result.classList.remove("show");
    });

    document.getElementById("calculate").onclick=()=>{
      const out=document.getElementById("sizeResult");
      const detail=document.getElementById("detail");
      const label=document.getElementById("resultLabel");

      if(mode==="shoes"){
        const age=Number(ageSelect.value), shoe=shoes.find(s=>age<=s[0]);
        label.textContent="Start around:";
        out.textContent=ageSelect.value!==""&&shoe?`US ${shoe[1]}`:"Choose an age first 🙂";
        detail.textContent=ageSelect.value!==""&&shoe?ageSelect.options[ageSelect.selectedIndex].text:"";
      } else if(clothesTask==="check"){
        const currentMonths=Number(knownSize.value);
        const foundCm=Number(itemCm.value);
        label.textContent="Verdict:";

        if(!currentMonths||!foundCm){
          out.textContent="Pick both first 🙂";
          detail.textContent="";
          result.classList.add("show");
          return;
        }

        const currentEntry=sizes.find(size=>size.m===currentMonths);
        const foundEntry=cmSizes.find(size=>size.cm===foundCm);
        const foundUs=sizes.find(size=>size.cm===foundCm);
        const diff=foundCm-currentEntry.cm;

        if(diff<=-6){
          out.textContent="Probably too small";
        } else if(diff>=6){
          out.textContent="Room to grow";
        } else {
          out.textContent="About right";
        }

        const foundUsLabel=foundCm===92?"24M / 2T":(foundUs?.us || formatSize(foundEntry,"us"));
        detail.textContent=`${foundCm} cm ≈ ${foundUsLabel} • They wear ${currentEntry.us} ≈ ${currentEntry.cm} cm`;
      } else {
        const current=Number(currentSize.value), value=target.value;
        label.textContent="Best bet:";

        if(!current||!value){
          out.textContent="Pick both first 🙂";
          detail.textContent="";
          result.classList.add("show");
          return;
        }

        const [y,m]=value.split("-").map(Number);
        const away=(y-now.getFullYear())*12+(m-1-now.getMonth());
        const recommendationTable=clothesUnit==="cm"?cmSizes:sizes;
        const recommended=recommendationTable.find(s=>s.m>=current+away)||recommendationTable.at(-1);
        const alternateUnit=clothesUnit==="us"?"cm":"us";
        const dateLabel=new Date(y,m-1).toLocaleDateString("en-US",{month:"long",year:"numeric"});

        out.textContent=formatSize(recommended,clothesUnit);
        detail.textContent=`≈ ${formatSize(recommended,alternateUnit)} • ${dateLabel}`;
      }

      result.classList.add("show");
    };
  </script>
</body>
</html>
