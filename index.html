<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Size Will They Be?</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,sans-serif; background:#f6fcff; color:#5b5a57; }
    main { width:min(680px,100%); background:#f4f8f6; border:1px solid #dcdFA3; border-radius:24px; padding:40px; box-shadow:0 14px 40px rgba(91,90,87,.10); }
    h1 { margin:0 0 10px; font-size:clamp(2rem,6vw,3.5rem); line-height:1; color:#373733; }
    .intro { margin:0 0 14px; font-size:1.1rem; color:#5f5d5b; }
    .tabs { display:flex; gap:8px; margin-bottom:26px; }
    .tab { width:auto; min-height:38px; margin:0; padding:0 26px; border:1px solid #abb7d8; background:white; color:#373733; }
    .tab.active { background:#afdc99; border-color:#8ebc7b; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .fields.one { grid-template-columns:1fr; }
    label { display:block; margin-bottom:8px; font-weight:700; }
    select,input,button { width:100%; min-height:52px; border-radius:12px; font:inherit; }
    select,input { border:1px solid #abb7d8; padding:0 14px; background:#fff; color:#373733; }
    button { margin-top:22px; border:0; background:#5b5a57; color:white; font-weight:700; cursor:pointer; }
    button:hover { opacity:.9; }
    #result { display:none; margin-top:26px; padding:24px; border-radius:16px; background:#afdc99; text-align:center; color:#373733; }
    #result.show { display:block; }
    #sizeResult { display:block; margin:8px 0; font-size:3rem; font-weight:800; }
    #detail,.note { color:#5f5d5b; }
    .note { margin:20px 0 0; font-size:.85rem; text-align:center; }
    .hidden { display:none; }
    @media (max-width:560px) { main{padding:28px 22px}.fields{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:0} }
  </style>
</head>
<body>
  <main>
    <h1>What size will they be?</h1>
    <p class="intro" id="intro">They wear this size now. What size should you buy for later?</p>

    <div class="tabs">
      <button class="tab active" data-mode="clothes">Clothes</button>
      <button class="tab" data-mode="shoes">Shoes</button>
    </div>

    <div id="clothesFields" class="fields">
      <div>
        <label for="currentSize">They wear...</label>
        <select id="currentSize">
          <option value="">Choose a size</option>
          <option value="3">3M</option><option value="6">6M</option><option value="9">9M</option>
          <option value="12">12M</option><option value="18">18M</option><option value="24">24M</option>
          <option value="30">2T</option><option value="36">3T</option><option value="48">4T</option><option value="60">5T</option>
        </select>
      </div>
      <div>
        <label for="targetDate">I need it to fit in...</label>
        <input id="targetDate" type="month" />
      </div>
    </div>

    <div id="shoeFields" class="fields one hidden">
      <div>
        <label for="age">They are... (months old)</label>
        <input id="age" type="number" min="0" max="60" placeholder="20" />
      </div>
    </div>

    <button id="calculate">Tell me what size to buy</button>

    <section id="result" aria-live="polite">
      <div id="resultLabel">Best bet:</div>
      <span id="sizeResult"></span>
      <div id="detail"></div>
    </section>

    <p class="note" id="note">Quick estimate only — kids and brands grow differently.</p>
  </main>

  <script>
    const sizes=[{m:3,l:"3M"},{m:6,l:"6M"},{m:9,l:"9M"},{m:12,l:"12M"},{m:18,l:"18M"},{m:24,l:"24M"},{m:30,l:"2T"},{m:36,l:"3T"},{m:48,l:"4T"},{m:60,l:"5T"}];
    const shoes=[[3,"1–2C"],[6,"2–3C"],[9,"3–4C"],[12,"4–5C"],[18,"5–6C"],[24,"6–7C"],[30,"7–8C"],[36,"8–9C"],[42,"9–10C"],[48,"10–11C"],[54,"11–12C"],[60,"12–13C"]];
    const now=new Date(), target=document.getElementById("targetDate"), result=document.getElementById("result");
    target.min=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    let mode="clothes";

    document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
      mode=tab.dataset.mode;
      document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===tab));
      document.getElementById("clothesFields").classList.toggle("hidden",mode!=="clothes");
      document.getElementById("shoeFields").classList.toggle("hidden",mode!=="shoes");
      document.getElementById("intro").textContent=mode==="clothes"?"They wear this size now. What size should you buy for later?":"How old are they? Get a starting shoe size.";
      document.getElementById("calculate").textContent=mode==="clothes"?"Tell me what size to buy":"Tell me what size to try";
      document.getElementById("note").textContent=mode==="clothes"?"Quick estimate only — kids and brands grow differently.":"Starting point only — shoe fit varies a lot by kid and brand.";
      result.classList.remove("show");
    });

    document.getElementById("calculate").onclick=()=>{
      const out=document.getElementById("sizeResult"), detail=document.getElementById("detail"), label=document.getElementById("resultLabel");
      if(mode==="shoes"){
        const age=Number(document.getElementById("age").value), shoe=shoes.find(s=>age<=s[0]);
        label.textContent="Start around:";
        out.textContent=age>=0&&shoe?`US ${shoe[1]}`:"Enter an age from 0–60 months 🙂";
        detail.textContent=age>=0&&shoe?`${age} month${age===1?"":"s"} old`:"";
      } else {
        const current=Number(document.getElementById("currentSize").value), value=target.value;
        label.textContent="Best bet:";
        if(!current||!value){ out.textContent="Pick both first 🙂"; detail.textContent=""; result.classList.add("show"); return; }
        const [y,m]=value.split("-").map(Number), away=(y-now.getFullYear())*12+(m-1-now.getMonth());
        out.textContent=(sizes.find(s=>s.m>=current+away)||sizes.at(-1)).l;
        detail.textContent=new Date(y,m-1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
      }
      result.classList.add("show");
    };
  </script>
</body>
</html>
